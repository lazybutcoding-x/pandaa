<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🐼 Panda Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&family=Patrick+Hand&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --black:      #1a1a1a;
      --charcoal:   #2d2d2d;
      --dark-grey:  #3e3e3e;
      --mid-grey:   #6b6b6b;
      --light-grey: #b0b0b0;
      --off-white:  #f5f2ed;
      --pure-white: #ffffff;
      --cream:      #faf7f2;
      --warm-white: #ede9e0;
      --bamboo:     #7daa5e;
      --bamboo-lt:  #a8c98a;
      --bamboo-dk:  #4e7a35;
      --blush:      #f4a7b0;
      --blush-lt:   #fcd5da;
      --sky:        #a8d8ea;
      --shadow:     rgba(30,30,30,0.18);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; cursor: none; }

    /* ── Custom Panda Cursor ─────────────────────────── */
    #cursor {
      position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999;
      width: 36px; height: 36px;
      transform: translate(-50%, -50%);
      transition: transform .12s cubic-bezier(.34,1.56,.64,1);
    }
    #cursor svg { width: 100%; height: 100%; }
    #cursor.hovered { transform: translate(-50%, -50%) scale(1.4) rotate(-10deg); }

    .paw-trail {
      position: fixed; pointer-events: none; z-index: 9998;
      width: 18px; height: 18px;
      transform: translate(-50%, -50%) rotate(var(--rot, 0deg));
      opacity: 0;
      animation: pawFade .8s ease-out forwards;
    }
    @keyframes pawFade {
      0%   { opacity: .65; transform: translate(-50%,-50%) rotate(var(--rot,0deg)) scale(1); }
      100% { opacity: 0;   transform: translate(-50%,-50%) rotate(var(--rot,0deg)) scale(.4); }
    }

    /* ── Page ────────────────────────────────────────── */
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Nunito', sans-serif;
      background: #e8e4db;
      overflow: hidden;
      position: relative;
    }

    /* Soft paper texture */
    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none;
      background-image:
        radial-gradient(ellipse at 25% 20%, rgba(255,255,255,.55) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 80%, rgba(125,170,94,.12) 0%, transparent 50%);
    }

    /* ── Bamboo decoration ───────────────────────────── */
    .bamboo-wrap {
      position: fixed; top: 0; bottom: 0; pointer-events: none;
      display: flex; gap: 0;
    }
    .bamboo-wrap.left  { left: 0; }
    .bamboo-wrap.right { right: 0; }

    .bamboo-stalk {
      position: relative; width: 28px; opacity: .55;
    }
    .bamboo-stalk svg { height: 100%; width: 100%; }

    /* Floating pandas in bg */
    .bg-panda {
      position: fixed; pointer-events: none; font-size: 2.2rem;
      animation: floatPanda 8s ease-in-out infinite alternate;
      opacity: .12; user-select: none;
    }
    .bp1 { top: 10%; left: 12%; animation-delay: 0s;   font-size: 3rem; }
    .bp2 { top: 70%; left: 6%;  animation-delay: -3s;  font-size: 1.8rem; }
    .bp3 { top: 20%; right: 8%; animation-delay: -1.5s; font-size: 2.5rem; }
    .bp4 { bottom: 15%; right: 5%; animation-delay: -4s; font-size: 2rem; }
    @keyframes floatPanda {
      from { transform: translateY(0) rotate(-5deg); }
      to   { transform: translateY(-18px) rotate(5deg); }
    }

    /* ── Calculator wrap ─────────────────────────────── */
    .calc-wrap {
      position: relative; z-index: 10;
      animation: bounceIn .7s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes bounceIn {
      from { opacity: 0; transform: translateY(50px) scale(.85); }
      to   { opacity: 1; transform: translateY(0)    scale(1);   }
    }

    /* Panda head on top */
    .panda-head {
      display: flex; justify-content: center; margin-bottom: -18px; position: relative; z-index: 2;
    }
    .panda-head svg { width: 130px; height: 110px; filter: drop-shadow(0 4px 12px rgba(0,0,0,.2)); }

    .calculator {
      width: 340px;
      background: var(--pure-white);
      border-radius: 32px;
      padding: 28px 22px 22px;
      box-shadow:
        0 8px 0 #c8c4ba,
        0 14px 40px rgba(0,0,0,.22),
        0 2px 0 rgba(255,255,255,.9) inset;
      border: 3px solid var(--warm-white);
      position: relative;
    }

    /* Ear patches */
    .calculator::before,
    .calculator::after {
      content: '';
      position: absolute; top: -18px;
      width: 38px; height: 38px;
      background: var(--black);
      border-radius: 50%;
      border: 3px solid var(--pure-white);
    }
    .calculator::before { left: 18px; }
    .calculator::after  { right: 18px; }

    /* ── Display ─────────────────────────────────────── */
    .display {
      background: var(--cream);
      border: 2.5px solid var(--warm-white);
      border-radius: 18px;
      padding: 16px 18px 12px;
      margin-bottom: 18px;
      min-height: 96px;
      display: flex; flex-direction: column; align-items: flex-end; justify-content: flex-end;
      position: relative; overflow: hidden;
      box-shadow: inset 0 2px 8px rgba(0,0,0,.07);
    }
    /* little bamboo accent */
    .display::before {
      content: '🎋';
      position: absolute; top: 8px; left: 10px;
      font-size: 18px; opacity: .18;
    }

    .expression {
      font-family: 'Patrick Hand', cursive; font-size: 13px;
      color: var(--mid-grey);
      min-height: 18px; text-align: right; letter-spacing: .5px;
    }
    .result {
      font-family: 'Nunito', sans-serif; font-size: 42px; font-weight: 900;
      color: var(--black);
      letter-spacing: 1px; margin-top: 4px; text-align: right;
      transition: transform .08s;
    }
    .result.pop { animation: pop .18s ease; }
    @keyframes pop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    /* ── Grid ────────────────────────────────────────── */
    .btn-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    /* ── Base Button ─────────────────────────────────── */
    button {
      font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 17px;
      height: 62px; border-radius: 16px; border: none;
      position: relative; overflow: hidden;
      transition: transform .1s cubic-bezier(.34,1.56,.64,1), box-shadow .12s ease;
      letter-spacing: .3px;
    }
    button::after {       /* shine */
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,.35) 0%, transparent 100%);
      border-radius: 16px 16px 0 0; pointer-events: none;
    }
    button:hover  { transform: translateY(-3px) scale(1.03); }
    button:active { transform: translateY(1px) scale(.97); }

    /* Number buttons — soft white/cream */
    .btn-num {
      background: var(--off-white);
      color: var(--charcoal);
      box-shadow: 0 4px 0 #ccc8be, 0 6px 14px rgba(0,0,0,.1);
      border: 1.5px solid #dedad3;
    }
    .btn-num:hover { box-shadow: 0 6px 0 #ccc8be, 0 10px 20px rgba(0,0,0,.13); }
    .btn-num:active { box-shadow: 0 1px 0 #ccc8be; }

    /* Operator buttons — bamboo green */
    .btn-op {
      background: linear-gradient(160deg, var(--bamboo-lt), var(--bamboo));
      color: var(--pure-white);
      box-shadow: 0 4px 0 var(--bamboo-dk), 0 6px 14px rgba(78,122,53,.25);
      border: 1.5px solid var(--bamboo-dk);
      text-shadow: 0 1px 2px rgba(0,0,0,.2);
    }
    .btn-op:hover  { box-shadow: 0 6px 0 var(--bamboo-dk), 0 10px 22px rgba(78,122,53,.35); }
    .btn-op:active { box-shadow: 0 1px 0 var(--bamboo-dk); }

    /* Function buttons — soft grey */
    .btn-fn {
      background: linear-gradient(160deg, #d5d1c8, #c0bcb2);
      color: var(--charcoal);
      box-shadow: 0 4px 0 #9e9b93, 0 6px 14px rgba(0,0,0,.1);
      border: 1.5px solid #aeab a3;
    }
    .btn-fn:hover  { box-shadow: 0 6px 0 #9e9b93, 0 10px 20px rgba(0,0,0,.14); }
    .btn-fn:active { box-shadow: 0 1px 0 #9e9b93; }

    /* Equals — blush pink (panda nose) */
    .btn-eq {
      background: linear-gradient(160deg, var(--blush-lt), var(--blush));
      color: var(--charcoal);
      box-shadow: 0 4px 0 #d8808e, 0 6px 14px rgba(244,167,176,.4);
      border: 1.5px solid #d8808e;
      font-size: 20px;
    }
    .btn-eq:hover  { box-shadow: 0 6px 0 #d8808e, 0 10px 24px rgba(244,167,176,.55); }
    .btn-eq:active { box-shadow: 0 1px 0 #d8808e; }

    .span2 { grid-column: span 2; border-radius: 30px; }

    /* ── Panda face decoration on keyboard ──────────── */
    .panda-divider {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 12px; padding: 0 4px;
      opacity: .45;
    }
    .panda-divider span { flex:1; height: 1.5px; background: var(--warm-white); }
    .panda-divider em { font-style: normal; font-size: 18px; }

    /* ── Wobble on equals ────────────────────────────── */
    @keyframes wobble {
      0%,100% { transform: rotate(0); }
      25%      { transform: rotate(-3deg) scale(1.02); }
      75%      { transform: rotate(3deg)  scale(1.02); }
    }
    .calculator.wobble { animation: wobble .35s ease; }
  </style>
</head>
<body>

<!-- Calculator -->
<div class="calc-wrap">

  <!-- SVG Panda head on top -->
  <div class="panda-head">

      <!-- Ears (outer black) -->
      <circle cx="22" cy="28" r="20" fill="#1a1a1a"/>

      <span></span><em>🐾</em><em>🎋</em><em>🐾</em><span></span>

      <button class="btn-fn"  data-action="clear">AC</button>

<script>
  /* ── Panda Paw Cursor ─────────────────── */
  const cursor = document.getElementById('cursor');
  let lastPaw = 0, lastX = -100, lastY = -100, pawFlip = false;

  document.addEventListener('mousemove', e => {
    lastX = e.clientX; lastY = e.clientY;
    cursor.style.left = lastX + 'px';
    cursor.style.top  = lastY + 'px';

    const now = Date.now();
    if (now - lastPaw > 120) {
      lastPaw = now;
      spawnPaw(lastX, lastY);
      pawFlip = !pawFlip;
    }
  });

  document.querySelectorAll('button').forEach(b => {
    b.addEventListener('mouseenter', () => cursor.classList.add('hovered'));
    b.addEventListener('mouseleave', () => cursor.classList.remove('hovered'));
  });

  function spawnPaw(x, y) {
    const el = document.createElement('div');
    el.className = 'paw-trail';
    const rot = (Math.random() * 30 - 15) + (pawFlip ? 20 : -20);
    el.style.setProperty('--rot', rot + 'deg');
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.innerHTML = `<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="20" cy="24" rx="12" ry="10" fill="#1a1a1a" opacity=".7"/>
      <circle cx="12" cy="13" r="4.5" fill="#1a1a1a" opacity=".7"/>
      <circle cx="20" cy="11" r="4.5" fill="#1a1a1a" opacity=".7"/>
      <circle cx="28" cy="13" r="4.5" fill="#1a1a1a" opacity=".7"/>
      <ellipse cx="20" cy="25" rx="7" ry="5.5" fill="#f4a7b0" opacity=".6"/>
    </svg>`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 850);
  }

  /* ── Bamboo confetti on = ─────────────── */
  function spawnBambooConfetti() {
    const emojis = ['🎋','🐼','🐾','⭐','✨'];
    for (let i = 0; i < 14; i++) {
      const el = document.createElement('div');
      el.style.cssText = `
        position:fixed; pointer-events:none; z-index:9997; font-size:${16+Math.random()*14}px;
        left:${30+Math.random()*40}%; top:${30+Math.random()*30}%;
        animation: confettiFly ${.6+Math.random()*.8}s ease-out forwards;
        opacity:1;
      `;
      el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1500);
    }
  }

  // Inject confetti keyframes
  const style = document.createElement('style');
  style.textContent = `
    @keyframes confettiFly {
      0%   { transform: translate(0,0) rotate(0deg) scale(1); opacity:1; }
      100% { transform: translate(${Math.random()>0.5?'':'-'}${60+Math.random()*80}px, -${80+Math.random()*80}px) rotate(${Math.random()*360}deg) scale(.3); opacity:0; }
    }
  `;
  document.head.appendChild(style);

  /* ── Calculator Logic ────────────────── */
  let currentVal = '0', operator = null, prevVal = null, waitNext = false, exprStr = '';
  const resultEl     = document.getElementById('result');
  const expressionEl = document.getElementById('expression');
  const calcEl       = document.getElementById('calc');

  function updateDisplay(v) {
    resultEl.textContent = v;
    resultEl.classList.remove('pop');
    void resultEl.offsetWidth;
    resultEl.classList.add('pop');
  }

  function handleNum(val) {
    if (waitNext) { currentVal = val; waitNext = false; }
    else currentVal = currentVal === '0' ? val : currentVal + val;
    if (currentVal.length > 12) currentVal = currentVal.slice(0,12);
    updateDisplay(currentVal);
  }

  function handleOp(op) {
    if (operator && !waitNext) calculate(false);
    prevVal = currentVal; operator = op; waitNext = true;
    exprStr = prevVal + ' ' + op;
    expressionEl.textContent = exprStr;
  }

  function calculate(doConfetti = true) {
    if (operator === null || prevVal === null) return;
    const a = parseFloat(prevVal), b = parseFloat(currentVal);
    let res;
    switch(operator) {
      case '+': res = a + b; break;
      case '−': res = a - b; break;
      case '×': res = a * b; break;
      case '÷': res = b !== 0 ? a / b : 'Error'; break;
    }
    exprStr = prevVal + ' ' + operator + ' ' + currentVal + ' =';
    expressionEl.textContent = exprStr;
    currentVal = res === 'Error' ? 'Error' : parseFloat(res.toFixed(10)).toString();
    if (currentVal.length > 12) currentVal = parseFloat(res).toExponential(4);
    operator = null; prevVal = null; waitNext = true;
    updateDisplay(currentVal);

    if (doConfetti) {
      spawnBambooConfetti();
      calcEl.classList.remove('wobble');
      void calcEl.offsetWidth;
      calcEl.classList.add('wobble');
      setTimeout(() => calcEl.classList.remove('wobble'), 400);
    }
  }

  document.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      const { action, val } = btn.dataset;
      if (action === 'num')     handleNum(val);
      else if (action === 'op') handleOp(val);
      else if (action === 'equals')  calculate();
      else if (action === 'clear') {
        currentVal = '0'; operator = null; prevVal = null; waitNext = false; exprStr = '';
        updateDisplay('0'); expressionEl.textContent = '';
      }
      else if (action === 'sign') {
        if (currentVal !== '0') { currentVal = (parseFloat(currentVal)*-1).toString(); updateDisplay(currentVal); }
      }
      else if (action === 'percent') {
        currentVal = (parseFloat(currentVal)/100).toString(); updateDisplay(currentVal);
      }
      else if (action === 'decimal') {
        if (waitNext) { currentVal = '0.'; waitNext = false; }
        else if (!currentVal.includes('.')) currentVal += '.';
        updateDisplay(currentVal);
      }
    });
  });

  /* Keyboard */
  document.addEventListener('keydown', e => {
    if ('0123456789'.includes(e.key)) handleNum(e.key);
    else if (e.key === '+') handleOp('+');
    else if (e.key === '-') handleOp('−');
    else if (e.key === '*') handleOp('×');
    else if (e.key === '/') { e.preventDefault(); handleOp('÷'); }
    else if (e.key === 'Enter' || e.key === '=') calculate();
    else if (e.key === 'Backspace') {
      currentVal = currentVal.length > 1 ? currentVal.slice(0,-1) : '0';
      updateDisplay(currentVal);
    }
    else if (e.key === 'Escape') {
      currentVal = '0'; operator = null; prevVal = null; waitNext = false; exprStr = '';
      updateDisplay('0'); expressionEl.textContent = '';
    }
    else if (e.key === '.') {
      if (!currentVal.includes('.')) { currentVal += '.'; updateDisplay(currentVal); }
    }
  });
</script>
</body>
</html>
